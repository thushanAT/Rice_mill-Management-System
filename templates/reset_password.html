<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('rice_mill_theme') || 'light';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <title>Reset Password | Rice Mill Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='dark_theme.css', v='agri-green-v9') }}">
</head>

<body class="auth-page">

    <div class="auth-shell">

        <!-- LEFT SIDE -->
        <section class="visual">

            <div class="brand">
                <span class="brand-icon">🌾</span>
                <span>RICE MILL MANAGEMENT</span>
            </div>

            <div class="visual-content">
                <h1>
                    Create a new
                    <br>
                    password.
                </h1>

                <p>
                    Choose a strong password to protect your
                    rice mill management account and continue
                    managing your business securely.
                </p>
            </div>

        </section>

        <!-- RIGHT SIDE -->
        <section class="form-side">

            <div class="form-card">

                <h2>Reset Password</h2>

                <p class="form-subtitle">
                    Create a new password for your account.
                </p>

                <form id="resetPasswordForm" method="POST"
                      action="{{ url_for('reset_password') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="field">
                        <label>New Password</label>
                        <input type="password"
                               name="new_password"
                               id="newPassword"
                               placeholder="Enter new password"
                               minlength="8" maxlength="128"
                               required>
                    </div>

                    <div class="field">
                        <label>Confirm New Password</label>
                        <input type="password"
                               name="confirm_password"
                               id="confirmPassword"
                               placeholder="Re-enter new password"
                               minlength="8" maxlength="128"
                               required>
                    </div>

                    <button id="resetPasswordSubmit" type="submit" class="btn">
                        Reset Password
                    </button>
                </form>
                <p id="recoveryStatus" class="recovery-status" role="status" aria-live="polite"></p>

            </div>

        </section>

    </div>

    <script src="{{ url_for('static', filename='validation.js') }}" defer></script>
    <script src="{{ url_for('static', filename='password_recovery.js') }}" defer></script>

</body>
</html>
