<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Cash Refund | {{ mill_name }}</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 24px;
            background: #f2f5f1;
            color: #26332a;
            font: 14px/1.5 Arial, sans-serif;
        }
        .page {
            max-width: 820px;
            margin: 0 auto;
        }
        .receipt {
            padding: 32px;
            background: #fff;
            border-top: 6px solid #2f6b3c;
            box-shadow: 0 5px 20px #18371c18;
        }
        .receipt-header {
            text-align: center;
            border-bottom: 1px solid #dbe5d8;
            padding-bottom: 18px;
        }
        .receipt-header h1 {
            margin: 0;
            color: #204f2b;
            font-size: 25px;
        }
        .receipt-header p {
            margin: 5px 0 0;
            color: #647166;
        }
        .facts {
            display: grid;
            grid-template-columns: repeat(2,minmax(0,1fr));
            gap: 10px;
            margin: 20px 0;
        }
        .fact {
            min-width: 0;
            padding: 11px;
            background: #f5f8f3;
            overflow-wrap: anywhere;
        }
        .fact span {
            display: block;
            color: #66736a;
            font-size: 12px;
        }
        .fact strong {
            color: #26332a;
        }
        .table-wrap {
            overflow-x: auto;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
        }
        .table th, .table td {
            border: 1px solid #dbe5d8;
            padding: 10px;
            text-align: left;
        }
        .table th {
            background: #f3f8f1;
        }
        .right {
            text-align: right !important;
            white-space: nowrap;
        }
        .total {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin: 18px 0;
            padding: 14px;
            background: #f1f7ed;
            font-size: 18px;
            font-weight: 700;
        }
        .status {
            min-height: 24px;
            margin: 14px 0;
            color: #9d2a20;
            font-weight: 700;
        }
        .status.success {
            color: #246b34;
        }
        .actions {
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 10px;
            margin: 16px 0;
        }
        .actions[hidden] {
            display: none !important;
        }
        .actions button, .actions a {
            min-height: 42px;
            padding: 10px 16px;
            border: 0;
            border-radius: 6px;
            background: #2f6b3c;
            color: #fff;
            text-decoration: none;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        .actions .secondary {
            border: 1px solid #2f6b3c;
            background: #fff;
            color: #204f2b;
        }
        .actions button:disabled {
            opacity: .6;
            cursor: wait;
        }
        .print-only {
            display: none;
        }
        @media (max-width: 600px) {
            body {
                padding: 0;
            }
            .receipt {
                padding: 20px;
            }
            .facts {
                grid-template-columns: 1fr;
            }
            .actions {
                padding: 0 12px;
            }
            .total {
                font-size: 16px;
            }
        }
        @media print {
            body {
                padding: 0;
                background: #fff;
            }
            .page {
                max-width: none;
            }
            .receipt {
                padding: 18px;
                border-top: 0;
                box-shadow: none;
            }
            .actions, .status {
                display: none !important;
            }
            .print-only {
                display: block;
            }
        }
    </style>
</head>
<body>
    <main class="page" data-return-id="{{ return_id }}">
        <article class="receipt" aria-labelledby="receiptTitle">
            <header class="receipt-header">
                <h1 id="millName">{{ mill_name }}</h1>
                <p id="receiptTitle">Cash Refund Bill / Receipt</p>
            </header>
            <section class="facts" id="refundFacts" aria-live="polite">
                <div class="fact">Loading refund bill…</div>
            </section>
            <div class="table-wrap">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Returned quantity</th>
                            <th class="right">Original price</th>
                            <th class="right">Return value</th>
                        </tr>
                    </thead>
                    <tbody id="refundItems">
                        <tr>
                            <td colspan="4">Loading bill items…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="total">
                <span>Total refund</span>
                <span id="refundTotal">Rs. 0.00</span>
            </div>
            <p class="print-only">Thank you.</p>
        </article>
        <p class="status" id="refundStatus" role="status" aria-live="polite">Loading approved Return Bill…</p>
        <div class="actions" id="refundActions" hidden>
            <button type="button" class="secondary" id="finishConfirm">Finish &amp; Confirm</button>
            <button type="button" id="finishPrint">Finish &amp; Print Bill</button>
        </div>
    </main>
    <script>
        (() => {
            const root = document.querySelector("[data-return-id]");
            const returnId = Number(root?.dataset.returnId);
            const facts = document.getElementById("refundFacts");
            const rows = document.getElementById("refundItems");
            const total = document.getElementById("refundTotal");
            const status = document.getElementById("refundStatus");
            const actions = document.getElementById("refundActions");
            const initialMillName = document.getElementById("millName").textContent;
            const buttons = [document.getElementById("finishConfirm"), document.getElementById("finishPrint")];
            const token = document.querySelector('meta[name="csrf-token"]')?.content || "";
            const idempotencyKey = `refund-v1-return-${returnId}`;
            let refund = null, submitting = false, returnTimer = null;
            const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
            const money = value => `Rs. ${(Number(value)||0).toLocaleString("en-LK",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
            const date = value => {
                const parsed = value ? new Date(value) : null;
                return parsed && !Number.isNaN(parsed.valueOf()) ? parsed.toLocaleString() : "-";
            };
            async function readJson(response, label) {
                const body = await response.text();
                let data;
                try {
                    data = body ? JSON.parse(body) : {};
                } catch {
                    throw new Error(`${label} returned an unreadable response (HTTP ${response.status}). Refresh the page and try again.`);
                }
                if (!response.ok || !data.success) throw new Error(data.message || `${label} failed (HTTP ${response.status}).`);
                return data;
            }
            function returnToSalesAfterSuccess(message) {
                status.textContent = message;
                status.classList.add("success");
                actions.hidden = true;
                buttons.forEach(button => button.disabled = true);
                if (returnTimer) clearTimeout(returnTimer);
                returnTimer = setTimeout(() => window.location.replace("/sales"), 1400);
            }
            function render(data, completed = false) {
                refund = data;
                document.getElementById("millName").textContent = data.millName || initialMillName;
                facts.innerHTML = `<div class="fact"><span>Refund Bill / Receipt</span><strong>${esc(data.refundReference)}</strong></div><div class="fact"><span>Date and time</span><strong>${esc(date(data.date))}</strong></div><div class="fact"><span>Return Bill reference</span><strong>${esc(data.returnNo)}</strong></div><div class="fact"><span>Original invoice</span><strong>${esc(data.invoiceNo)}</strong></div><div class="fact"><span>Customer</span><strong>${esc(data.customerName)}</strong></div><div class="fact"><span>Refund payment method</span><strong>${esc(data.paymentMethod||"Cash")}</strong></div>`;
                rows.innerHTML = (data.items || []).map(item => `<tr><td>${esc(item.product)}${item.variety?` | ${esc(item.variety)}`:""}</td><td>${esc(item.quantity)} ${esc(item.unit)}${item.packageSize?` (${esc(item.packageSize)} kg/bag)`:""}</td><td class="right">${money(item.price)} / kg</td><td class="right">${money(item.value)}</td></tr>`).join("") || '<tr><td colspan="4">No return items found.</td></tr>';
                total.textContent = money(data.totalRefund);
                if (completed) {
                    submitting = true;
                    returnToSalesAfterSuccess("This Cash Refund is already completed. Returning to Sales; it will not be settled again.");
                } else {
                    status.textContent = "Review the customer bill, then choose one completion option.";
                    status.classList.remove("success");
                    actions.hidden = false;
                }
            }
            async function load() {
                if (!Number.isInteger(returnId) || returnId < 1) {
                    status.textContent = "A valid Return Bill is required.";
                    return;
                }
                try {
                    const response = await fetch(`/api/returns/${returnId}/refund-preview`, { credentials: "same-origin", headers: { Accept: "application/json" } });
                    const data = await readJson(response, "Loading the refund bill");
                    render(data.refund, Boolean(data.completed));
                } catch (error) {
                    status.textContent = error.message || "The refund bill could not be loaded.";
                    status.classList.remove("success");
                }
            }
            async function finish(printAfter) {
                if (!refund || submitting) return;
                submitting = true;
                buttons.forEach(button => button.disabled = true);
                status.classList.remove("success");
                status.textContent = "Saving the Cash Refund…";
                try {
                    const response = await fetch(`/api/returns/${returnId}/settle`, { method: "POST", credentials: "same-origin",
                        headers: { "Content-Type": "application/json", "Accept": "application/json", "X-CSRFToken": token, "Idempotency-Key": idempotencyKey },
                        body: JSON.stringify({ settlementType: "refund", idempotencyKey }) });
                    const result = await readJson(response, "Completing the Cash Refund");
                    refund.refundReference = result.documentNo || refund.refundReference;
                    refund.date = new Date().toISOString();
                    if (printAfter) {
                        if (!result.customerReceiptUrl) throw new Error("The Cash Refund was saved, but its customer receipt link was not returned.");
                        const receipt = new URL(result.customerReceiptUrl, window.location.origin);
                        if (receipt.origin !== window.location.origin) throw new Error("The customer receipt must open on this application.");
                        receipt.searchParams.set("autoPrint", "1");
                        receipt.searchParams.set("returnToSales", "1");
                        window.location.replace(`${receipt.pathname}${receipt.search}${receipt.hash}`);
                        return;
                    }
                    returnToSalesAfterSuccess("Cash Refund completed and saved successfully. Returning to Sales.");
                } catch (error) {
                    submitting = false;
                    try {
                        await load();
                        if (submitting) return;
                    } catch {}
                    status.textContent = error.message || "The Cash Refund could not be completed. The Return Bill remains available.";
                    status.classList.remove("success");
                    buttons.forEach(button => button.disabled = false);
                }
            }
            document.getElementById("finishConfirm").addEventListener("click", () => finish(false));
            document.getElementById("finishPrint").addEventListener("click", () => finish(true));
            load();
        })();
    </script>
</body>
</html>
