<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('rice_mill_theme') || 'light';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <title>Forgot Password | Rice Mill Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='dark_theme.css', v='agri-green-v9') }}">
</head>

<body class="auth-page">

    <div class="auth-shell">

        <!-- LEFT SIDE -->
        <section class="visual">

            <div class="brand">
                <span class="brand-icon">🌾</span>
                <span>RICE MILL MANAGEMENT</span>
            </div>

            <div class="visual-content">
                <h1>
                    Reset your
                    <br>
                    password.
                </h1>

                <p>
                    Enter the email address linked to your account
                    to begin resetting your password.
                </p>
            </div>

        </section>

        <!-- RIGHT SIDE -->
        <section class="form-side">

            <div class="form-card">

                <h2>Forgot Password?</h2>

                <p class="form-subtitle">
                    If the address belongs to an active account, recovery instructions may arrive shortly.
                </p>

                <form id="forgotPasswordForm" method="POST"
                      data-verify-url="{{ url_for('verify_otp') }}"
                      action="{{ url_for('forgot_password') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="field">
                        <label>Email Address</label>
                        <input type="email"
                               name="email"
                               placeholder="Enter your registered email"
                               required>
                    </div>

                    <button id="forgotPasswordSubmit" type="submit" class="btn">
                        Send Verification Code
                    </button>
                </form>
                <p id="recoveryStatus" class="recovery-status" role="status" aria-live="polite"></p>

                <div class="register-link">
                    Remember your password?
                    <a href="{{ url_for('login') }}">Back to Login</a>
                </div>

            </div>

        </section>

    </div>

    <script src="{{ url_for('static', filename='validation.js') }}"></script>
    <script>
        (() => {
            const form = document.getElementById("forgotPasswordForm");
            if (!form) return;
            form.addEventListener("submit", async event => {
                event.preventDefault();
                const input = form.querySelector('input[name="email"]');
                const button = document.getElementById("forgotPasswordSubmit");
                const status = document.getElementById("recoveryStatus");
                const email = (input && input.value || "").trim();
                if (!email) {
                    status.textContent = "Enter a valid email address.";
                    status.dataset.state = "error";
                    return;
                }
                button.disabled = true;
                button.textContent = "Sending…";
                status.textContent = "Submitting your request…";
                status.dataset.state = "";
                try {
                    const response = await fetch("/api/auth/forgot-password", {
                        method: "POST",
                        credentials: "same-origin",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": document.querySelector('meta[name="csrf-token"]').content
                        },
                        body: JSON.stringify({ email })
                    });
                    let result = {};
                    try {
                        result = await response.json();
                    } catch (_) { /* handled below */}
                    if (!response.ok || result.success === false) {
                        throw new Error(result.message || "The request could not be completed. Please try again.");
                    }
                    let hasStoredEmail = true;
                    try {
                        sessionStorage.setItem("riceMill.passwordRecoveryEmail", email);
                        sessionStorage.removeItem("riceMill.passwordResetAuthorization");
                        sessionStorage.setItem("riceMill.passwordRecoveryResendAfter", String(Date.now() + 60000));
                    } catch (_) {
                        hasStoredEmail = false;
                    }
                    status.textContent = hasStoredEmail ? result.message
                        : "Request received. Enter your email again on the verification page to continue.";
                    status.dataset.state = "success";
                    window.location.assign(form.dataset.verifyUrl || "/verify-otp");
                } catch (error) {
                    status.textContent = error instanceof TypeError
                        ? "We could not reach the recovery service. Check your connection and try again."
                        : error.message;
                    status.dataset.state = "error";
                    button.disabled = false;
                    button.textContent = "Send Verification Code";
                }
            });
        })();
    </script>
    <script src="{{ url_for('static', filename='password_recovery.js', v='recovery-nav-4') }}" defer></script>

</body>
</html>
